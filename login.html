<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Social0x1 · Sign in</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        const storageKey = "social0x1-theme";
        const root = document.documentElement;
        if (!root) return;

        const mediaQuery =
          typeof window.matchMedia === "function"
            ? window.matchMedia("(prefers-color-scheme: dark)")
            : null;
        const systemPreference = mediaQuery?.matches ? "dark" : "light";
        let resolvedTheme = systemPreference || "light";

        try {
          const stored = window.localStorage.getItem(storageKey);
          if (stored === "light" || stored === "dark") {
            resolvedTheme = stored;
          } else if (stored === "system") {
            resolvedTheme = systemPreference || "light";
          }
        } catch (error) {
          resolvedTheme = systemPreference || "light";
        }

        root.setAttribute("data-theme", resolvedTheme);
        root.style.colorScheme = resolvedTheme;
      })();
    </script>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script defer src="config/firebase-config.js"></script>
  </head>
  <body class="auth-page">
    <main>
      <section class="auth-card" data-auth-card>
        <header class="auth-header">
          <div class="branding">
            <h1>Social0x1</h1>
            <p>Private messenger for people you trust.</p>
          </div>
          <nav class="theme-toggle" aria-label="Theme selection">
            <button type="button" data-theme-mode="light">Light</button>
            <button type="button" data-theme-mode="dark">Dark</button>
            <button type="button" data-theme-mode="system">System</button>
          </nav>
        </header>

        <div class="auth-tabs" role="tablist" aria-label="Authentication options">
          <button type="button" data-auth-tab="login" class="active" role="tab" aria-selected="true">
            Log In
          </button>
          <button type="button" data-auth-tab="signup" role="tab" aria-selected="false">
            Sign Up
          </button>
        </div>

        <form class="auth-form" data-auth-form="login" novalidate autocomplete="on">
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input
              id="login-password"
              name="password"
              type="password"
              required
              minlength="6"
              autocomplete="current-password"
            />
          </div>
          <button type="submit">Log in</button>
        </form>

        <form class="auth-form" data-auth-form="signup" hidden novalidate autocomplete="on">
          <div class="field">
            <label for="signup-name">Display name</label>
            <input id="signup-name" name="displayName" type="text" required minlength="2" maxlength="50" />
          </div>
          <div class="field">
            <label for="signup-email">Email</label>
            <input id="signup-email" name="email" type="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="signup-password">Password</label>
            <input
              id="signup-password"
              name="password"
              type="password"
              required
              minlength="6"
              autocomplete="new-password"
            />
          </div>
          <div class="field">
            <label for="signup-confirm">Confirm password</label>
            <input
              id="signup-confirm"
              name="confirmPassword"
              type="password"
              required
              minlength="6"
              autocomplete="new-password"
            />
          </div>
          <button type="submit">Create account</button>
        </form>

        <div class="auth-divider" role="presentation">
          <span>or</span>
        </div>
        <button type="button" class="google-button" data-google-signin>
          <svg width="20" height="20" aria-hidden="true">
            <use href="assets/icons.svg#icon-google"></use>
          </svg>
          Continue with Google
        </button>

        <p class="auth-feedback" data-auth-feedback role="status"></p>
        <p class="invite-note" data-invite-note hidden></p>
      </section>
    </main>

    <script type="module" src="js/login.js"></script>
  </body>
</html>
